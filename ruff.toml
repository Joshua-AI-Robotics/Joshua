line-length = 100
target-version = "py310"

exclude = [
  "bazel-bin/**",
  "bazel-out/**",
  "bazel-ProjectJoshua/**",
  "bazel-Joshua/**",
  "bazel-testlogs/**",
  "external/**",
  ".venv/**",
]

[lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = []

[format]
quote-style = "preserve"
indent-style = "space"
