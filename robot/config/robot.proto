syntax = "proto3";

import "robot/actuation/proto/actuation.proto";
import "robot/perception/proto/perception.proto";

package robot;

enum RobotType {
    ROBOT_INVALID = 0;
    MANIPULATOR_ARM = 1;
}

message Robot {
    string name = 1;
    uint64 id = 2;
    RobotType robot_type = 3;
    robot.actuation.Actuation actuation = 4;
    // TODO: Add perception here once ready.
}