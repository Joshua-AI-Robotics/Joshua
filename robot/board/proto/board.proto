syntax = "proto3";

import "robot/comm/proto/comm.proto";

package robot.board;

// The controller that runs the low-level motor loop. The board type says
// where that loop runs: an external MCU, the motor's own MCU (FEETECH_BUS),
// the host itself (HOST_GPIO), or nowhere (MOCK).
// Values name the native controller only — comm peripherals (e.g. an
// EasyCAT shield) belong to Board.comm and drive peripherals (e.g. a
// TB6600 stepper drive) to Channel.drive, never to the board type.
// See docs/BOARD_LAYER_RFC.md §5.6 and §6.1.
enum BoardType {
  BOARD_INVALID = 0;
  AM243 = 1;
  TEENSY41 = 2;
  ARDUINO_UNO = 3;
  FEETECH_BUS = 4;  // STS/SCS smart-servo register bus; the "board" is the
                    // servo's own MCU.
  HOST_GPIO = 5;    // Host-local digital pins; no external controller.
  MOCK = 6;         // Tests; channels are in-memory fakes.
  ESP32 = 7;        // MCU running Joshua firmware, same joshua_wire
                    // family as TEENSY41 (docs/BOARD_LAYER_RFC.md §7.3).
}

// The drive leg: how the board moves the motor (docs/BOARD_LAYER_RFC.md §5.5).
enum DriveInterface {
  DRIVE_INVALID = 0;
  STEP_DIR = 1;  // Pulse/direction stepper drive (TB6600, ...).
  PWM_DC = 2;
  SERVO_BUS_UART = 3;  // Feetech/Dynamixel-style register bus.
  CAN = 4;
  PDO_JOINT = 5;  // Slot in a cyclic EtherCAT process-data image.
}

message StepDirConfig {
  uint32 max_pulse_rate_hz = 1;
  bool invert_dir = 2;
  bool enable_active_low = 3;
  // GPIO pin mapping, pushed to firmware at Init() via CONFIGURE_CHANNEL —
  // not baked into the firmware image (docs/BOARD_LAYER_RFC.md §7.5,
  // revised: host-configured pins bring MCU-firmware boards in line with
  // every other board type, all of which already put their hardware-
  // addressing fact in config — AM243's PDO offsets, FeetechBusBoard's
  // servo_id, HostGpioConfig's pins below). Values are MCU pin numbers
  // (Arduino-style integer pin, e.g. Teensy 4.1's digital pin 2), specific
  // to the exact firmware image flashed; IDENTIFY still catches a
  // mismatched firmware/channel-count/drive-type, but cannot verify a pin
  // number is physically wired the way config claims — that remains on
  // whoever wires the board.
  optional uint32 step_pin = 4;
  optional uint32 dir_pin = 5;
  optional uint32 enable_pin = 6;
  // STEP pulse HIGH width in microseconds. Host-configurable for the same
  // reason pins are: it's a fact about the specific STEP/DIR driver chip
  // wired up (an opto-isolated input may need a wider pulse than a direct
  // logic input), not something the firmware image should hardcode. 0
  // (the default when unset) falls back to firmware's own default — 20us,
  // conservative for a TB6600's opto-isolated 3.3V-driven input
  // (firmware/teensy/41/src/backend_stepdir.cpp) — so existing configs
  // that don't set this keep working unchanged.
  uint32 step_pulse_width_us = 7;
}

message ServoBusConfig {
  uint32 servo_id = 1;
  // Feetech "Moving Time" register value (ms), pushed once as a
  // CONFIGURE_CHANNEL tunable at board Init and bundled into every goal
  // position write thereafter (docs/BOARD_LAYER_RFC.md §10 Phase 4).
  uint32 move_time_ms = 2;
}

message PwmConfig {
  uint32 frequency_hz = 1;
  float deadband = 2;
}

message HostGpioConfig {
  // Legacy motor-channel shape, retained for diagnostics. HOST_GPIO uses
  // Board.host_gpio_config and rejects motor channels until a pulse backend exists.
  string gpio_chip = 1;      // e.g. "/dev/gpiochip0"
  repeated uint32 pins = 2;  // Pin group on the host header.
}

// Header positions and profile-qualified aliases resolve to one physical pin.
message PinRef {
  oneof address {
    uint32 header_pin = 1;
    uint32 firmware_pin = 4;  // MCU native pin ID; requires a pinned MCU profile.
    string signal = 2;        // e.g. "J8.GPIO17"; never an unqualified BCM number.
  }
  string connector = 3;  // Required when physical positions are ambiguous.
}

message PinProfileRef {
  string id = 1;
  uint32 version = 2;
}

message StepDirWiring {
  PinRef step = 1;
  PinRef direction = 2;
  PinRef enable = 3;
}

enum DigitalDirection {
  DIGITAL_DIRECTION_UNSPECIFIED = 0;
  DIGITAL_INPUT = 1;
  DIGITAL_OUTPUT = 2;
}

enum DigitalBias {
  DIGITAL_BIAS_AS_IS = 0;
  DIGITAL_BIAS_DISABLED = 1;
  DIGITAL_BIAS_PULL_UP = 2;
  DIGITAL_BIAS_PULL_DOWN = 3;
}

message DigitalPinConfig {
  string name = 1;     // Board-local API handle, e.g. "status_led".
  string purpose = 2;  // Wiring intent, e.g. "cabinet ready indicator".
  PinRef pin = 3;
  DigitalDirection direction = 4;
  bool active_low = 5;
  DigitalBias bias = 6;
  // Logical values (after active_low). Both are required for outputs and
  // rejected for inputs. Release/crash levels require external circuitry.
  optional bool initial_value = 7;
  optional bool shutdown_value = 8;
}

message HostGpioBoardConfig {
  string profile_id = 1;
  uint32 profile_version = 2;  // Exact immutable catalog version, currently 1.
  repeated DigitalPinConfig pins = 3;
  string lease_directory = 4;  // Default /run/lock/joshua; share across containers.
}

// One motor slot on one board. Both wiring facts (e.g. StepDirConfig's
// pins) and tunables are pushed at Init() via CONFIGURE_CHANNEL — see
// StepDirConfig for why pins moved out of the firmware image
// (docs/BOARD_LAYER_RFC.md §7.5).
message Channel {
  uint32 index = 1;
  DriveInterface drive = 2;
  oneof drive_config {
    StepDirConfig step_dir = 10;
    ServoBusConfig servo_bus = 11;
    PwmConfig pwm = 12;
    HostGpioConfig host_gpio = 13;  // HOST_GPIO boards only.
  }
  StepDirWiring step_dir_wiring = 14;  // Alternative to legacy numeric fields.
}

// Which firmware the host expects on the board; checked against the
// IDENTIFY handshake at Init(). Omitted entirely for vendor-firmware
// boards (FEETECH_BUS) and for HOST_GPIO / MOCK.
message FirmwareSpec {
  uint32 min_proto_version = 1;
  // Required for images advertising CONFIGURABLE_WATCHDOGS; zero means absent.
  uint32 communication_watchdog_us = 2;
  uint32 target_watchdog_us = 3;
}

// Retired TI-demo schema: retained only to diagnose old configs; never executed.
enum Am243PdoMapping {
  AM243_PDO_MAPPING_UNSPECIFIED = 0;
  AM243_PDO_MAPPING_TI_DEMO = 1;
  AM243_PDO_MAPPING_ACTUATOR_V1 = 2;
}

message Am243Config {
  // Deprecated and rejected at validation/factory entry points. JoshuaWire
  // endpoint addressing/region assertions belong in comm.ethercat_config.
  uint32 slave_index = 1;
  Am243PdoMapping pdo_mapping = 2;
  // PDO region override (offsets/sizes) so presets can pin regions instead
  // of trusting GetPdoRegion auto-discovery.
  uint32 output_offset_bytes = 3;
  uint32 input_offset_bytes = 4;
  uint32 output_size_bytes = 5;
  uint32 input_size_bytes = 6;
}

// JoshuaWire 0.2.0 / revision 4 is the sole Joshua protocol; unspecified selects it on
// Joshua boards. Vendor boards retain their own protocol.
enum BoardProtocol {
  BOARD_PROTOCOL_UNSPECIFIED = 0;
  reserved 1;
  reserved "JOSHUA_WIRE_V1", "JOSHUA_WIRE_V2";
  JOSHUA_WIRE = 2;  // Preserve the validated protocol's protobuf value.
}

message Board {
  string name = 1;  // Referenced by actuators; cache key.
  BoardType board_type = 2;
  robot.comm.Comm comm = 3;       // Comm leg: how the PC reaches the controller
                                  // (omitted for HOST_GPIO / MOCK).
  repeated Channel channels = 4;  // Drive leg: what each slot drives.
  FirmwareSpec firmware = 5;
  BoardProtocol protocol = 6;
  // Host coordinator budgets for FRAME_STREAM. Software defaults are not
  // hardware timing qualification. All handles of an MCU share this policy.
  JoshuaWireHostPolicy joshua_wire_host_policy = 7;
  repeated BoardPeripheral peripherals = 9;
  PinProfileRef pin_profile = 8;  // MCU connector/native pin resolution.
  oneof board_config {
    Am243Config am243_config = 10;
    HostGpioBoardConfig host_gpio_config = 11;
  }
}

message JoshuaWireHostPolicy {
  optional uint32 operation_timeout_ms = 1;    // Default 200, queue + all attempts.
  optional uint32 attempt_timeout_ms = 2;      // Default 50, bounded by operation.
  optional uint32 polling_timeout_ms = 3;      // Default 40, including queue wait.
  optional uint32 max_attempts = 4;            // Default 2; allowed 1..4.
  optional uint32 max_pending_operations = 5;  // Default 16 ordinary operations.
  optional uint32 max_pending_bytes = 6;       // Default 4096, request + reply.
  optional uint32 max_priority_burst = 7;      // Default 8; fairness when slack fits.
  optional uint32 scheduling_guard_ms = 8;     // Default 1.
  optional uint32 max_notifications = 9;       // Default 32 latest raw envelopes.
  optional uint32 max_streams = 10;            // Default 16 shared subscriptions.
  // Explicit aggregate telemetry reservation, in complete-frame bytes/second.
  // Zero (default) prevents subscriptions until a workload budget is selected.
  uint32 telemetry_bytes_per_second = 11;
  // Reserved internal GET_STATUS cadence. Zero disables heartbeat. Never
  // refreshes actuator targets. Requires explicit firmware watchdog budgets.
  uint32 heartbeat_period_ms = 12;
}

message PwmOutputConfig {
  PinRef pin = 1;
  uint32 frequency_hz = 2;
  optional double initial_duty_cycle = 3;  // 0..1; starts disabled.
}
message SpiPeripheralConfig {
  PinRef clock = 1;
  PinRef mosi = 2;
  PinRef miso = 3;
  PinRef chip_select = 4;
  robot.comm.SpiConfig settings = 5;
  uint32 bus_index = 6;  // MCU native bus, ignored/rejected on Linux.
}
message I2cPeripheralConfig {
  PinRef sda = 1;
  PinRef scl = 2;
  robot.comm.I2cConfig settings = 3;
  uint32 bus_index = 4;
}
message UartPeripheralConfig {
  PinRef tx = 1;
  PinRef rx = 2;
  robot.comm.SerialConfig settings = 3;  // 8N1 byte-stream policy.
  uint32 bus_index = 4;
  string controller = 5;  // Linux device-tree controller-node assertion.
}
message BoardPeripheral {
  string name = 1;
  string purpose = 2;
  optional uint32 function_id = 3;  // MCU firmware slot 192..199; absent on Linux.
  oneof operation {
    PwmOutputConfig pwm = 10;
    SpiPeripheralConfig spi = 11;
    I2cPeripheralConfig i2c = 12;
    UartPeripheralConfig uart = 13;
  }
}
