syntax = "proto3";

package robot.action;

// Preset commands to position the actuator in a known state.
// Should be defined in a config.
enum PresetCommand {
  PRESET_UNKNOWN = 0;
  PRESET_MIDDLE_POSITION = 1;
  PRESET_IDLE_POSITION = 2;
  PRESET_TEARDOWN = 3;
  PRESET_ENABLE_TORQUE = 4;
  PRESET_DISABLE_TORQUE = 5;
  PRESET_RESET_ENCODER = 6;
}

// Unified actuator motion command. Presence distinguishes omitted fields from zero.
message JointCommand {
  enum Units {
    // Driver-defined position, move-speed setting and effort (never an enable gate).
    NATIVE = 0;
    // Physical position, velocity and effort: rad, rad/s, N*m for revolute joints.
    SI = 1;
  }
  string joint_name = 1;
  optional double position = 2;
  optional double velocity = 3;
  optional double effort = 4;  // NATIVE may mean duty cycle for a driver with that contract.
  // Source metadata only; no coordinate transformation is implied.
  string frame_id = 5;
  Units units = 6;
}

// Main action packet - uses oneof for type safety
message ActionPacket {
  string action_id = 1;
  // For joint, preserves the source stamp (including zero/negative
  // values). Clock domain, scheduling and freshness are not inferred.
  // TODO(hmoon): Sync the timestamp unit and source across the system.
  uint64 timestamp_ns = 2;
  uint64 sqeuence_id = 3;  // Monotonically increasing sequence number for the action packet.

  // If true, joint.position is in [-1, 1] and mapped to native operational limits.
  // Only valid with NATIVE units; cleared by the subscriber after mapping.
  bool normalized = 4;

  oneof action_type {
    JointCommand joint = 5;    // Unified actuator motion.
    PresetCommand preset = 6;  // Preset command
  }
}
