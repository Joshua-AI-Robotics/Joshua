syntax = "proto3";

package robot.comm;

// The communication method to control the actions.
enum CommType {
  COMM_INVALID = 0;
  SERIAL = 1;
  ETHERCAT = 2;
  ETHERNET_UDP = 3;
}

// A communication behavior used by the consumer. CommType selects the
// mechanism; each required TransportType selects one interface CommFactory
// exposes from it.
enum TransportType {
  TRANSPORT_INVALID = 0;
  BYTE_STREAM = 1;
  MESSAGE = 2;
  // Raw process image swapped every cycle. Only the retained TI EtherCAT demo
  // uses it; Joshua firmware uses CORRELATED_CYCLIC.
  CYCLIC = 3;
  // Correlated request/response slots carried in the cyclic process image.
  CORRELATED_CYCLIC = 4;
}

message Comm {
  CommType comm_type = 1;
  oneof comm_config {
    SerialConfig serial_config = 2;
    EthercatConfig ethercat_config = 3;
    UdpConfig udp_config = 4;
  }
  // Single-capability form, still accepted for configs that use exactly one
  // transport. Set this or required_transports, not both.
  TransportType transport_type = 5;
  // Every capability the consumer uses from this comm, without duplicates.
  repeated TransportType required_transports = 6;
}

message SerialConfig {
  uint64 id = 1;
  string port = 2;
  uint64 baudrate = 3;
}

message UdpConfig {
  string host = 1;
  uint32 port = 2;
}

enum EthercatProcessDataMode {
  ETHERCAT_PROCESS_DATA_MODE_INVALID = 0;
  ETHERCAT_PROCESS_DATA_MODE_SPLIT_LRD_LWR = 1;
  ETHERCAT_PROCESS_DATA_MODE_LRW = 2;
}

message EthercatConfig {
  string interface_name = 1;
  EthercatProcessDataMode process_data_mode = 2;
}
