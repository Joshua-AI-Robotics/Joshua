syntax = "proto3";

package robot.comm;

// The communication method to control the actions.
enum CommType {
  COMM_INVALID = 0;
  SERIAL = 1;
  ETHERCAT = 2;
  ETHERNET_UDP = 3;
}

// The communication behavior required by the consumer. CommType selects the
// mechanism; TransportType selects the interface exposed by CommFactory.
enum TransportType {
  TRANSPORT_INVALID = 0;
  BYTE_STREAM = 1;
  MESSAGE = 2;
  CYCLIC = 3;  // Generic capability; standalone EtherCAT/TI-demo use is retired.
  // Paired management/correlated-cyclic capabilities (JW EtherCAT today).
  MESSAGE_AND_CYCLIC = 4;
  // Continuous complete frames, consumed by one shared protocol coordinator.
  // SERIAL/JOSHUA_WIRE only. Cannot share a port with raw/request-only users.
  FRAME_STREAM = 5;
}

message Comm {
  CommType comm_type = 1;
  oneof comm_config {
    SerialConfig serial_config = 2;
    EthercatConfig ethercat_config = 3;
    UdpConfig udp_config = 4;
  }
  TransportType transport_type = 5;
}

// Response-boundary adapter for SERIAL MESSAGE communication.
enum SerialMessageAdapter {
  SERIAL_MESSAGE_ADAPTER_UNSPECIFIED = 0;
  CALLER_SIZED = 1;  // Caller supplies the response length for each exchange.
  JOSHUA_WIRE = 2;   // JoshuaWire sync byte and length prefix.
}

message SerialConfig {
  uint64 id = 1;
  string port = 2;
  uint64 baudrate = 3;
  // JOSHUA_WIRE exchange deadline, including queue wait and write/read.
  // Omitted preserves 100 ms; explicit zero is invalid. Only accepted with
  // JOSHUA_WIRE; CALLER_SIZED uses io_policy transaction/idle budgets.
  optional uint32 exchange_timeout_ms = 4;
  // Wait once after physical open, before exposing any capability. Zero means
  // no delay. Set 2000 for USB bridges that reset the MCU on open (e.g. CP2102).
  uint32 post_open_settle_ms = 5;
  // Required for MESSAGE; leave unspecified for BYTE_STREAM. CALLER_SIZED
  // supports vendor-protocol transactions with io_policy timing.
  SerialMessageAdapter message_adapter = 6;
  // Shared physical-owner admission and raw/vendor I/O policy. All users of
  // one port must agree on effective values, including defaults.
  SerialIoPolicy io_policy = 7;
  // FRAME_STREAM only; separate reserved reply and bounded telemetry storage.
  SerialFramePolicy frame_policy = 8;
}

message SerialFramePolicy {
  optional uint32 frame_idle_timeout_ms = 1;    // Default 100, partial frames only.
  optional uint32 max_reply_frames = 2;         // Default 4, range 1..256.
  optional uint32 max_notification_frames = 3;  // Default 32, range 1..256.
}

message SerialIoPolicy {
  // Total budgets include queue wait and I/O; progress never renews them.
  optional uint32 read_timeout_ms = 1;         // Default 500.
  optional uint32 read_idle_timeout_ms = 2;    // Default 100, active read only.
  optional uint32 write_timeout_ms = 3;        // Default 100.
  optional uint32 transaction_timeout_ms = 4;  // CALLER_SIZED default 100.
  optional uint32 max_pending_operations = 5;  // Default 16, includes active.
  optional uint32 max_pending_bytes = 6;       // Default 1048576, reserved I/O bytes.
  optional uint32 max_transfer_bytes = 7;      // Default 65536, request + response.
}

message UdpConfig {
  string host = 1;
  uint32 port = 2;
}

enum EthercatProcessDataMode {
  ETHERCAT_PROCESS_DATA_MODE_INVALID = 0;
  ETHERCAT_PROCESS_DATA_MODE_SPLIT_LRD_LWR = 1;
  ETHERCAT_PROCESS_DATA_MODE_LRW = 2;
}

message EthercatConfig {
  string interface_name = 1;
  EthercatProcessDataMode process_data_mode = 2;
  // One-based slave address for MESSAGE_AND_CYCLIC. Retired Am243Config
  // fields are rejected; addressing belongs here.
  uint32 slave_index = 3;
  EthercatTiming timing = 4;
  // Optional assertion against discovery, never an unchecked remapping.
  EthercatPdoRegion pdo_region = 5;
}

message EthercatPdoRegion {
  uint32 output_offset_bytes = 1;
  uint32 input_offset_bytes = 2;
  uint32 output_size_bytes = 3;
  uint32 input_size_bytes = 4;
}

// Explicit microsecond budgets; no implicit runtime defaults. All users of
// one NIC must declare the same timing. Firmware watchdog limits are separate.
message EthercatTiming {
  uint32 period_us = 1;
  uint32 process_timeout_us = 2;
  uint32 state_timeout_us = 3;
  uint32 operation_timeout_us = 4;
  uint32 mailbox_step_budget_us = 5;
  uint32 scheduling_guard_us = 6;
  uint32 response_timeout_us = 7;
}
