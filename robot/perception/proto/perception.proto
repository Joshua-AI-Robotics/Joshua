syntax = "proto3";

import "robot/comm/proto/comm.proto";
import "ros2/proto/node.proto";

package robot.perception;

// Describes what a sensor measures, independently of its hardware and
// communication mechanism.
enum SensorType {
  SENSOR_INVALID = 0;
  POSITION = 1;  // Linear or rotary position, in the channel's native unit.
  IMAGE = 2;
  RANGE_SCAN = 3;
  IMU_6DOF = 4;
  FORCE_TORQUE = 5;
  AUDIO = 6;
}

message OpenCvConfig {
  uint64 id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
  string fourcc = 5;
}

message Sts3215EncoderConfig {
  // Servo addresses belong to the board channel.
  string board_name = 1;
  uint32 channel = 2;
}

message Lds01Config {
  robot.comm.Comm comm = 1;
}

// ALSA capture. PCM is interleaved signed 16-bit little endian.
message AlsaAudioConfig {
  string device = 1;  // e.g. "plughw:CARD=Webcam,DEV=0"; never inferred.
  uint32 sample_rate_hz = 2;
  uint32 channels = 3;
  uint32 frames_per_chunk = 4;  // One frame contains one sample per channel.
  // Requested ALSA buffer duration, 1..1000 ms. Unset defaults to 200 ms.
  // Hardware may negotiate a different size; polling uses the actual capacity.
  optional uint32 capture_buffer_duration_ms = 5;
}

message SinglePerception {
  ros2.node.Node node = 1;
  string sensor_name = 2;
  uint64 id = 3;
  SensorType sensor_type = 4;
  oneof sensor_config {
    OpenCvConfig opencv_config = 5;
    Lds01Config lds01_config = 6;
    Sts3215EncoderConfig sts3215_encoder_config = 7;
    AlsaAudioConfig alsa_audio_config = 8;
  }
}

message Perception {
  repeated SinglePerception single_perceptions = 1;
}
