syntax = "proto3";

import "robot/comm_interface/proto/comm_interface.proto";

package robot.perception;

enum PerceptionType {
    PERCEPTION_INVALID = 0;
    CAMERA = 1;
    ENCODER = 2;
    LIDAR = 3;
    RADAR = 4;
    HID = 5; // Human Interface Device
}

enum CameraType {
    CAMERA_INVLAID = 0;
    OPENCV = 1;
}

enum EncoderType {
    ENCODER_INVLAID = 0;
    STS3215_ENCODER = 1;
}

enum LidarType {
    LIDAR_INVLAID = 0;
}

enum RadarType {
    RADAR_INVLAID = 0;
}

enum HidType {
    HID_INVLAID = 0;
}

message Camera {
    string camera_name = 1;
    uint64 id = 2;
    CameraType camera_type = 3;
    robot.comm_interface.CommType comm_type = 4;
    oneof comm_config {
        robot.comm_interface.SerialConfig serial_config = 5;
        // Add other comm type here.
    }
    oneof camera_config {
        OpenCvConfig opencv_config = 6;
    }
}

message Encoder {
    string encoder_name = 1;
    uint64 id = 2;
    EncoderType encoder_type = 3;
    robot.comm_interface.CommType comm_type = 4;
    uint32 operational_lower_limit = 5;
    uint32 operational_upper_limit = 6;
    bool publish_unnormalized_data = 7;
    oneof comm_config {
        robot.comm_interface.SerialConfig serial_config = 8;
        // Add other comm type here.
    }
    oneof encoder_config {
        Sts3215EncoderConfig sts3215_encoder_config = 9;
    }
}

message OpenCvConfig {
    uint64 id = 1;
    uint32 width = 2;
    uint32 height = 3;
    uint32 fps = 4;
}

message Sts3215EncoderConfig {
    uint64 servo_id = 1;    
}

message SinglePerception {
    uint32 node_id = 1;
    string publish_topic = 2;
    PerceptionType perception_type = 3;
    oneof perception_data {
        Camera camera = 4;
        Encoder encoder = 5;
    }
}

message Perception {
    repeated SinglePerception single_perceptions = 1;
}
