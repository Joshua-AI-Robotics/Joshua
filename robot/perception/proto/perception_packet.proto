syntax = "proto3";

package robot.perception;

// Image data for cameras
message ImageData {
  int32 width = 1;
  int32 height = 2;
  int32 channels = 3;   // 1=grayscale, 3=RGB, 4=RGBA
  string encoding = 4;  // "bgr8", "rgb8", "mono8", etc.
  bytes data = 5;       // Raw image bytes
}

// Position data for encoders
message PositionData {
  float position = 1;
  optional float velocity = 2;
}

// IMU/sensor data
message SensorData {
  repeated float values = 1;
  repeated string labels = 2;
  string unit = 3;
}

// Point cloud data (SoA layout, units in meters/seconds)
message PointCloudData {
  // Structure-of-Arrays for efficiency. All arrays should be the same length.
  repeated float x = 1;            // meters
  repeated float y = 2;            // meters
  repeated float z = 3;            // meters
  repeated float intensity = 4;    // unitless or sensor-specific; normalized if applicable
  repeated float time_offset = 5;  // seconds since start of scan (optional)

  // Cloud-level metadata
  uint32 width = 6;     // 1 for unorganized cloud
  uint32 height = 7;    // 1 for unorganized cloud
  bool is_dense = 8;    // true if no invalid/NaN points
  string frame_id = 9;  // optional frame name for this cloud
}

// Audio payload contract. timestamp on the enclosing packet is the estimated
// RobotTime in seconds of the first sample, adjusted for unread ALSA frames.
message AudioData {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  uint32 frames = 3;
  string encoding = 4;     // "s16le": signed, interleaved, little endian PCM.
  bytes data = 5;          // Exactly frames * channels * 2 bytes.
  bool discontinuity = 6;  // First chunk after startup or overrun recovery.
}

// Wire contract v1: device acquisition clock is opaque and never substituted
// for a ROS/Unix timestamp. Unit, validity and clock codes follow JoshuaWire.
message ScalarData {
  float value = 1;
  uint32 unit = 2;
  uint32 validity = 3;
  uint32 clock = 4;
  uint32 boot_id = 5;
  uint64 acquisition_us = 6;
  uint32 acquisition_sequence = 7;
  uint32 function_id = 8;
  uint32 session_id = 9;
  uint32 subscription_id = 10;
  uint32 period_us = 11;
  uint32 dropped_acquisitions = 12;
  uint64 sequence_gaps = 13;
  uint64 overwritten = 14;
  uint64 host_receipt_steady_ns = 15;
  uint64 receipt_age_us = 16;
  bool receipt_fresh = 17;
  bool usable = 18;
}

// Main perception packet - uses oneof for type safety
message PerceptionPacket {
  string perception_id = 1;
  // Host acquisition estimate in RobotTime seconds. Physical exposure and
  // firmware acquisition times require device support and domain conversion.
  double timestamp = 2;
  uint64 sequence_id = 3;  // Monotonically increasing sequence number for the perception packet.

  oneof data_type {
    ImageData image = 4;
    PositionData position = 5;
    SensorData sensor = 6;
    PointCloudData point_cloud = 7;
    AudioData audio = 8;
    ScalarData scalar = 9;
  }
}
