server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver for dynamic DNS resolution
    # This allows nginx to re-resolve hostnames at request time
    resolver 127.0.0.11 valid=30s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy to Zenoh bridge REST API (avoids CORS issues)
    location /api/zenoh/ {
        # Use environment variable for Zenoh bridge host:port
        # Set ZENOH_BRIDGE_URL environment variable in docker-compose.yml
        # Format: host:port (e.g., host.docker.internal:8000 or zenoh-bridge-ros2dds:8000)
        # Using variable-based proxy_pass enables dynamic DNS resolution at request time
        set $zenoh_upstream "${ZENOH_BRIDGE_URL}";
        proxy_pass http://$zenoh_upstream/;
        proxy_http_version 1.1;
        
        # SSE (Server-Sent Events) support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Basic proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserve original Accept header (don't force text/event-stream for REST calls)
        # The client will set Accept: text/event-stream for SSE requests
        proxy_set_header Accept $http_accept;
        
        # For SSE, clear Connection header
        proxy_set_header Connection '';
        
        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control" always;
        add_header Access-Control-Expose-Headers "Content-Type" always;
        
        # Handle preflight requests
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Content-Type, Cache-Control" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}

