syntax = "proto3";

import "ros2/proto/node.proto";

package config;

enum CalibrationMode {
  CALIBRATION_MODE_INVALID = 0;
  CALIBRATION_MODE_OPERATIONAL_LIMIT = 1;
}

message SingleCalibration {
  ros2.node.Node node = 1;
  CalibrationMode calibration_mode = 2;
  // Publish topics will be automatically generated as "subscribe_topics_operational_limit".
  // And publish topic data type will be std_msgs::msg::Float32MultiArray.
  // TODO: Maybe there's a better way to generically represent this.

  // TODO: Add calibration config.
}

message Calibration {
  repeated SingleCalibration single_calibrations = 1;
}
