syntax = "proto3";

import "config/proto/robot.proto";
import "config/proto/ai.proto";
import "simulation/proto/simulation.proto";

package config;

// Process-wide ROS discovery settings, applied before initializing ROS.
message Ros2NetworkConfig {
  enum Discovery {
    INHERIT = 0;       // Preserve environment-based discovery settings.
    AUTOMATIC = 1;     // Fast DDS discovery on the local subnet.
    LOCALHOST = 2;     // Fast DDS discovery on this computer only.
    STATIC_PEERS = 3;  // Fast DDS unicast discovery, including loopback.
  }
  optional uint32 domain_id = 1;  // Omitted: inherit ROS_DOMAIN_ID (default 0).
  Discovery discovery = 2;
  repeated string peers = 3;  // Unicast IPv4 addresses; STATIC_PEERS only.
  // Probe participant IDs [0, count) on each host (default 32, maximum 120).
  optional uint32 participant_scan_count = 4;
}

message General {
  enum OperationMode {
    MODE_INVALID = 0;
    MODE_TELEOPERATE = 1;
    MODE_INFERENCE = 2;
    MODE_TEST = 3;
    MODE_DATA_STORE = 4;
    MODE_SIMULATION = 5;
  }

  enum RobotType {
    ROBOT_TYPE_INVALID = 0;
    ROBOT_TYPE_MANIPULATOR_ARM = 1;
  }

  OperationMode operation_mode = 1;
  RobotType robot_type = 2;
  string name = 3;
  uint64 id = 4;
  Ros2NetworkConfig ros2_network = 6;
}

message Config {
  General general = 1;
  config.Robot robot = 2;
  config.Ai ai = 3;
  simulation.SimulationConfig simulation = 4;
}
