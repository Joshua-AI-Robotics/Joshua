syntax = "proto3";

import "config/proto/robot.proto";
import "config/proto/ai.proto";
import "simulation/proto/simulation.proto";

package config;

message General {
  enum OperationMode {
    MODE_INVALID = 0;
    MODE_TELEOPERATE = 1;
    MODE_INFERENCE = 2;
    MODE_TEST = 3;
    MODE_DATA_STORE = 4;
    MODE_SIMULATION = 5;
  }

  enum RobotType {
    ROBOT_TYPE_INVALID = 0;
    ROBOT_TYPE_MANIPULATOR_ARM = 1;
  }

  enum Ros2LogMode {
    ROS2_LOG_BOTH = 0;  // Default: glog console plus ROS /rosout and files.
    ROS2_LOG_ROS = 1;
    ROS2_LOG_GLOG = 2;
  }

  OperationMode operation_mode = 1;
  RobotType robot_type = 2;
  string name = 3;
  uint64 id = 4;
  Ros2LogMode ros2_log_mode = 5;
}

message Config {
  General general = 1;
  config.Robot robot = 2;
  config.Ai ai = 3;
  simulation.SimulationConfig simulation = 4;
}
