syntax = "proto3";

import "config/proto/robot.proto";
import "config/proto/ai.proto";

package config;

message General {
    enum OperationMode {
    MODE_INVALID = 0;
    MODE_TELEOPERATE = 1;
    MODE_INFERENCE = 2;
    MODE_TRAINING = 3;
    MODE_CALIBRATION = 4;
    MODE_TEST = 5;
    }
    OperationMode operation_mode = 1;
}

message Config {
    General general = 1;
    config.Robot robot = 2;
    config.Ai ai = 3;
}
