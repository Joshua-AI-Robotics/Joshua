syntax = "proto3";

import "config/proto/robot.proto";
import "config/proto/ai.proto";

package config;

enum OperationMode {
    MODE_INVALID = 0;
    MODE_TELEOPERATE = 1;
    MODE_INFERENCE = 2;
    MODE_TRAINING = 3;
    MODE_TEST = 4;
}

message Config {
    OperationMode operation_mode = 1;
    config.Robot robot = 2;
    config.Ai ai = 3;
}
