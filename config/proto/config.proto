syntax = "proto3";

import "config/proto/robot.proto";
import "config/proto/ai.proto";
import "simulation/proto/simulation.proto";

package config;

message General {
  enum OperationMode {
    MODE_INVALID = 0;
    MODE_TELEOPERATE = 1;
    MODE_INFERENCE = 2;
    MODE_TEST = 5;
    MODE_DATA_STORE = 6;
    MODE_SIMULATION = 7;
    reserved 4;  // MODE_CALIBRATION: calibration subsystem removed.
  }

  enum RobotType {
    ROBOT_TYPE_INVALID = 0;
    ROBOT_TYPE_MANIPULATOR_ARM = 1;
  }

  OperationMode operation_mode = 1;
  RobotType robot_type = 2;
  string name = 3;
  uint64 id = 4;
}

message Config {
  General general = 1;
  config.Robot robot = 2;
  config.Ai ai = 3;
  simulation.SimulationConfig simulation = 5;
  reserved 4;  // calibration: calibration subsystem removed.
}
