syntax = "proto3";

import "robot/action/proto/action.proto";
import "robot/perception/proto/perception.proto";

package config;

enum RobotType {
    ROBOT_INVALID = 0;
    MANIPULATOR_ARM = 1;
}

message Robot {
    string name = 1;
    uint64 id = 2;
    RobotType robot_type = 3;
    uint32 trigger_frequency = 4;
    robot.action.Action actions = 5;
    robot.perception.Perception perceptions = 6;
}
