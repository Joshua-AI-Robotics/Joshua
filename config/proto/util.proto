syntax = "proto3";

package config;

import "ros2/proto/node.proto";

// Utilities consume existing topics; they never own capture devices.
message Utilities {
  repeated MediaStream media_streams = 1;
  repeated Notification notifications = 2;
}

message MediaStream {
  // One IMAGE input, optionally one UINT8_MULTI_ARRAY audio input, and one
  // STRING status output. A unique node id is required.
  ros2.node.Node node = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 fps = 4;
  uint32 bitrate_kbps = 5;
  string stream_name = 6;
  // Empty means discover this machine's IPv4 address using `tailscale ip -4`.
  // Only Tailscale IPv4 or loopback addresses are accepted.
  string listen_address = 7;
  uint32 http_port = 8;
  uint32 ice_port = 9;
  uint32 rtsp_port = 10;
  // Empty disables recording. Absolute paths and ~/ paths are supported.
  // Use a dedicated directory; only managed clips are eligible for deletion.
  string recording_directory = 11;
  // Zero selects 120 seconds / 20 percent respectively.
  uint32 recording_segment_sec = 12;
  uint32 recording_reserve_percent = 13;
}

// STRING event inputs and one distinct STRING delivery-status output.
message Notification {
  ros2.node.Node node = 1;
  string home_assistant_url = 2;
  // Name of an environment variable holding the private webhook file path.
  string webhook_file_env = 3;
  double request_timeout_sec = 4;
  double max_event_age_sec = 5;
  double cooldown_sec = 6;
  double movement_persistence_sec = 7;
  double input_timeout_sec = 8;
}
