syntax = "proto3";

package ros2.node;

import "ros2/proto/ros2_data_type.proto";

// Enum values here must match with the file name under ros2/
// (e.g. camera_publisher.cc, encoder_publisher.cc, etc.)
// This is used to resolve the native binary path.
enum NodeType {
  NODE_INVALID = 0;
  CAMERA_PUBLISHER = 1;
  ENCODER_PUBLISHER = 2;
  ACTUATOR_SUBSCRIBER = 3;
  OPERATIONAL_LIMIT_CALIBRATION = 4;
  INFERENCE = 5;
  LIDAR_PUBLISHER = 6;
  DATA_SUBSCRIBER = 7;
  TRAJECTORY_PUBLISHER = 8;
}

enum QosReliabilityPolicy {
  QOS_RELIABILITY_POLICY_RELIABLE = 0;  // Default if not specified.
  QOS_RELIABILITY_POLICY_BEST_EFFORT = 1;
}

enum QosDurabilityPolicy {
  QOS_DURABILITY_POLICY_VOLATILE = 0;  // Default if not specified.
  QOS_DURABILITY_POLICY_TRANSIENT_LOCAL = 1;
}

enum QosHistoryPolicy {
  QOS_HISTORY_POLICY_KEEP_LAST = 0;  // Default if not specified.
  QOS_HISTORY_POLICY_KEEP_ALL = 1;
}

enum QosLivelinessPolicy {
  QOS_LIVELINESS_POLICY_AUTOMATIC = 0;  // Default if not specified.
  QOS_LIVELINESS_POLICY_MANUAL_BY_TOPIC =
      1;  // Liveliness must be explicitly asserted via an API call.
}

// Serialized protobuf type on UINT8_MULTI_ARRAY topics.
// UNSPECIFIED defaults by publisher node: perception publishers -> PerceptionPacket,
// action/inference/trajectory publishers -> ActionPacket.
// Actuator subscriptions accept ActionPacket only (not PerceptionPacket).
enum PayloadType {
  PAYLOAD_TYPE_UNSPECIFIED = 0;
  PAYLOAD_TYPE_ACTION_PACKET = 1;
  PAYLOAD_TYPE_PERCEPTION_PACKET = 2;
}

message QosSetting {
  QosReliabilityPolicy reliability_policy = 1;
  QosDurabilityPolicy durability_policy = 2;
  QosHistoryPolicy history_policy = 3;
  uint32 depth = 4;
  QosLivelinessPolicy liveliness_policy = 5;
  uint64 liveliness_lease_duration_nanoseconds = 6;
  uint64 deadline_nanoseconds = 7;
  uint64 lifespan_nanoseconds = 8;
}

message Publisher {
  ros2.data_type.Ros2DataType ros2_data_type = 1;
  string topic = 2;
  uint32 publish_rate_hz = 3;
  PayloadType payload_type = 4;
}

message Subscription {
  ros2.data_type.Ros2DataType ros2_data_type = 1;
  string topic = 2;
  PayloadType payload_type = 3;
}

message Node {
  uint32 id = 1;
  NodeType node_type = 2;
  QosSetting qos_setting = 3;
  repeated Publisher publishers = 4;
  repeated Subscription subscriptions = 5;
}
