repos:
  - repo: local
    hooks:
      - id: lint-check
        name: comprehensive lint check
        entry: hooks/lint_check.sh
        language: system
        files: "\\.(c|cc|cpp|cxx|h|hh|hpp|hxx|proto|yaml|yml)$"
        stages: [pre-push]
        pass_filenames: true

  # Custom hooks (run after linting)
  - repo: local
    hooks:
      - id: run-local-hooks
        name: run local custom pre-push hooks
        entry: hooks/run_local_hooks.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
