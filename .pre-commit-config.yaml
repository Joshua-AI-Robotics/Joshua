repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [manual]
      - id: end-of-file-fixer
        stages: [manual]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        stages: [manual, pre-push]

  - repo: local
    hooks:
      - id: clang-format-check
        name: clang-format (check)
        entry: hooks/clang_format_check.sh
        language: system
        files: "\\.(c|cc|cpp|cxx|h|hh|hpp|hxx|proto)$"
        stages: [pre-push]
        pass_filenames: true

  - repo: local
    hooks:
      - id: run-local-hooks
        name: run local custom pre-push hooks
        entry: hooks/run_local_hooks.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
