repos:
  - repo: local
    hooks:
      - id: lint-check
        name: Lint & Format Checks
        entry: hooks/lint_check.sh
        language: system
        files: "\\.(c|cc|cpp|cxx|h|hh|hpp|hxx|proto|yaml|yml)$"
        stages: [pre-push]
        pass_filenames: true

  # Custom hooks (run after linting)
  - repo: local
    hooks:
      - id: sample-check
        name: Sample Check
        entry: hooks/sample_check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
