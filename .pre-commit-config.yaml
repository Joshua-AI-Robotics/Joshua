repos:
  - repo: local
    hooks:
      - id: lint-check
        name: Lint & Format Checks
        entry: hooks/lint_check.sh
        language: system
        stages: [pre-push]
        pass_filenames: false

  # Custom hooks (run after linting)
  - repo: local
    hooks:
      - id: sample-check
        name: Sample Check
        entry: hooks/sample_check.py
        language: system
        pass_filenames: false
        stages: [pre-push]
