name: CI

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch: {}

jobs:
  entrypoint-contract:
    name: Docker entrypoint contract
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check Docker-first invariants
        run: ./scripts/docker_entrypoints_test.sh

  docker-test:
    name: Docker tests (${{ matrix.os }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: u22
            service: test-u22
            shell: joshua-u22
          - os: u24
            service: test-u24
            shell: joshua-u24

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          docker system prune -af
          echo "Disk space after cleanup:"
          df -h

      - name: Build Docker image
        run: docker compose build ${{ matrix.service }}

      # Regression check for the non-interactive ROS bug: task commands must
      # see a sourced ROS environment. CPU overlay because runners have no GPU.
      - name: Verify ROS environment in non-interactive shell
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml
          run --rm ${{ matrix.shell }}
          bash -c 'test -n "$AMENT_PREFIX_PATH" && python3 -c "import rclpy" && echo "ROS environment OK"'

      - name: Run Bazel tests in Docker
        run: docker compose run --rm ${{ matrix.service }}
