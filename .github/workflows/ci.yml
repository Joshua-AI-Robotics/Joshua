name: CI

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Mount Bazel Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v2

      - name: Run Tests
        run: bazel test //...
