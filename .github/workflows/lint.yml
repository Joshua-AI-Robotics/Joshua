name: Lint

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch: {}

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install clang-format
        uses: jidicula/clang-format-action@v3
        with:
          clang-format-version: '14'

      - name: Run pre-commit (all files, pre-push stage)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-push
