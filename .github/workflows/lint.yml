name: Lint

on:
  pull_request:
    branches: [ develop ]
  workflow_dispatch: {}

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache clang-format
        uses: actions/cache@v4
        with:
          path: /usr/bin/clang-format-14
          key: clang-format-14-${{ runner.os }}

      - name: Install clang-format
        run: |
          if ! command -v clang-format-14 &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang-format-14
          fi

      - name: Run pre-commit (all files, pre-push stage)
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage pre-push
