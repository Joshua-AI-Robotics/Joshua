# Joshua Project Docker Compose
# Supports: linux/amd64, linux/arm64
#
# Build images (native architecture):
#   docker compose build                    # Build all images
#   docker compose build joshua-u22         # Build Ubuntu 22.04 only
#   docker compose build joshua-u24         # Build Ubuntu 24.04 only
#
# Build for ARM64 (cross-platform):
#   docker compose build joshua-u22-arm64   # Build Ubuntu 22.04 for ARM64
#   docker compose build joshua-u24-arm64   # Build Ubuntu 24.04 for ARM64
#
# Run containers:
#   docker compose run --rm joshua-u22      # Interactive shell (Ubuntu 22.04 + Humble)
#   docker compose run --rm joshua-u24      # Interactive shell (Ubuntu 24.04 + Jazzy)
#
# Run with Bazel target:
#   docker compose run --rm joshua-u22 bazel run launcher:joshua_main

services:
  # ============================================
  # AMD64 (x86_64) Services
  # ============================================

  # Ubuntu 22.04 + ROS2 Humble + Python 3.10 (Production ready)
  joshua-u22:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu22
      platforms:
        - linux/amd64
    image: joshua:u22-humble
    container_name: joshua-u22-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-}
    working_dir: /workspace

  # Ubuntu 24.04 + ROS2 Jazzy + Python 3.12 (Experimental - needs source updates)
  joshua-u24:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu24
      platforms:
        - linux/amd64
    image: joshua:u24-jazzy
    container_name: joshua-u24-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY:-}
    working_dir: /workspace

  # ============================================
  # ARM64 (aarch64) Services
  # ============================================

  # Ubuntu 22.04 + ROS2 Humble + Python 3.10 for ARM64
  joshua-u22-arm64:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu22
      platforms:
        - linux/arm64
    image: joshua:u22-humble-arm64
    container_name: joshua-u22-arm64-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-}
    working_dir: /workspace

  # Ubuntu 24.04 + ROS2 Jazzy + Python 3.12 for ARM64 (Experimental)
  joshua-u24-arm64:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu24
      platforms:
        - linux/arm64
    image: joshua:u24-jazzy-arm64
    container_name: joshua-u24-arm64-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY:-}
    working_dir: /workspace
  
  joshua-ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: joshua-ui
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ZENOH_BRIDGE_URL=${ZENOH_BRIDGE_URL:-host.docker.internal:8000}
    restart: unless-stopped

