# Joshua Project Docker Compose
# Requires: Docker Compose v2 (use 'docker compose', not 'docker-compose')
# Supports: linux/amd64, linux/arm64
#
# Build images (native architecture):
#   docker compose build                    # Build all images
#   docker compose build joshua-u22         # Build Ubuntu 22.04 only
#   docker compose build joshua-u24         # Build Ubuntu 24.04 only
#
# Build for ARM64 (cross-platform):
#   docker compose build joshua-u22-arm64   # Build Ubuntu 22.04 for ARM64
#   docker compose build joshua-u24-arm64   # Build Ubuntu 24.04 for ARM64
#   docker compose build joshua-mac-u22-arm64  # Build Ubuntu 22.04 for ARM64 (macOS optimized with mock serial ports)
#
# Run containers:
#   docker compose run --rm joshua-u22      # Interactive shell (Ubuntu 22.04 + Humble)
#   docker compose run --rm joshua-u24      # Interactive shell (Ubuntu 24.04 + Jazzy)
#   docker compose run --rm joshua-mac-u22-arm64  # Interactive shell (Ubuntu 22.04 + Humble, macOS optimized)
#
# Canonical task entrypoints:
#   docker compose run --rm test-u22
#   CONFIG=config/config_preset/so100/teleoperate.pbtxt docker compose run --rm run-u22
#   TARGET=//launcher:joshua_main_pkg docker compose run --rm build-u22-x86
#
# Developer shells and launcher tasks request an NVIDIA GPU by default. Use
# docker-compose.cpu.yml as an explicit fallback on CPU-only hosts.
# The Makefile provides optional shorthand for these commands.

x-nvidia-gpu: &nvidia-gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ============================================
  # AMD64 (x86_64) Services
  # ============================================

  # Ubuntu 22.04 + ROS2 Humble + Python 3.10 (Production ready)
  joshua-u22:
    <<: *nvidia-gpu
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu22
      platforms:
        - linux/amd64
    image: joshua:u22-humble
    container_name: joshua-u22-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
      # Persist Bazel cache to host machine
      - bazel-cache-u22:/root/.cache/bazel
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-}
      # Persist per-model inference venvs on the bind-mounted repo (survives --rm)
      - JOSHUA_ENV_CACHE=/workspace/.cache/joshua/envs
    working_dir: /workspace

  # Ubuntu 24.04 + ROS2 Jazzy + Python 3.12 (Experimental - needs source updates)
  # Note: Use profile 'u24' to build this service
  joshua-u24:
    <<: *nvidia-gpu
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu24
      platforms:
        - linux/amd64
    image: joshua:u24-jazzy
    container_name: joshua-u24-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
      - bazel-cache-u24:/root/.cache/bazel
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY:-}
      - JOSHUA_ENV_CACHE=/workspace/.cache/joshua/envs
    working_dir: /workspace
    profiles:
      - u24  # Only build when explicitly requested

  # ============================================
  # One-shot development tasks
  # ============================================

  test-u22:
    extends:
      service: joshua-u22
    deploy:
      resources:
        reservations:
          devices: !reset []
    container_name: joshua-test-u22
    command:
      - bash
      - -lc
      - >-
        tests=$$(bazel query 'kind(".*_test rule", //...)');
        if [[ -z "$$tests" ]]; then echo 'No Bazel test targets found.'; exit 0; fi;
        bazel test --config=u22 --config=x86-base
        --@rules_python//python/config_settings:python_version=3.10 $$tests
    profiles: [tasks]

  test-u24:
    extends:
      service: joshua-u24
    deploy:
      resources:
        reservations:
          devices: !reset []
    container_name: joshua-test-u24
    command:
      - bash
      - -lc
      - >-
        tests=$$(bazel query 'kind(".*_test rule", //...)');
        if [[ -z "$$tests" ]]; then echo 'No Bazel test targets found.'; exit 0; fi;
        bazel test --config=u24 --config=x86-base
        --@rules_python//python/config_settings:python_version=3.12 $$tests
    profiles: [tasks]

  run-u22:
    extends:
      service: joshua-u22
    container_name: joshua-run-u22
    environment:
      - CONFIG=${CONFIG:-}
    command:
      - bash
      - -lc
      - >-
        bazel run --config=u22 --config=x86-base
        --@rules_python//python/config_settings:python_version=3.10
        //launcher:joshua_main -- $${CONFIG:+--config "$$CONFIG"}
    profiles: [tasks]

  run-u24:
    extends:
      service: joshua-u24
    container_name: joshua-run-u24
    environment:
      - CONFIG=${CONFIG:-}
    command:
      - bash
      - -lc
      - >-
        bazel run --config=u24 --config=x86-base
        --@rules_python//python/config_settings:python_version=3.12
        //launcher:joshua_main -- $${CONFIG:+--config "$$CONFIG"}
    profiles: [tasks]

  build-u22-x86:
    extends:
      service: joshua-u22
    deploy:
      resources:
        reservations:
          devices: !reset []
    container_name: joshua-build-u22-x86
    command:
      - /workspace/scripts/container_build.sh
      - u22
      - x86
      - ${TARGET:-//launcher:joshua_main_pkg}
      - --config=u22
      - --config=x86-base
      - --@rules_python//python/config_settings:python_version=3.10
    profiles: [tasks]

  build-u24-x86:
    extends:
      service: joshua-u24
    deploy:
      resources:
        reservations:
          devices: !reset []
    container_name: joshua-build-u24-x86
    command:
      - /workspace/scripts/container_build.sh
      - u24
      - x86
      - ${TARGET:-//launcher:joshua_main_pkg}
      - --config=u24
      - --config=x86-base
      - --@rules_python//python/config_settings:python_version=3.12
    profiles: [tasks]

  # ============================================
  # ARM64 (aarch64) Services
  # ============================================

  # Ubuntu 22.04 + ROS2 Humble + Python 3.10 for ARM64
  # Note: Use profile 'arm64' to build these services (requires cross-platform build support)
  joshua-u22-arm64:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu22
      platforms:
        - linux/arm64
    image: joshua:u22-humble-arm64
    container_name: joshua-u22-arm64-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
      - bazel-cache-u22-arm64:/root/.cache/bazel
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-}
      - JOSHUA_ENV_CACHE=/workspace/.cache/joshua/envs
    working_dir: /workspace
    profiles:
      - arm64  # Only build when explicitly requested

  # Ubuntu 22.04 + ROS2 Humble + Python 3.10 for ARM64 (macOS optimized)
  # This service includes mock serial port support for development on macOS
  # Note: Use profile 'arm64' or 'mac' to build this service
  joshua-mac-u22-arm64:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu22
      platforms:
        - linux/arm64
    image: joshua:u22-humble-mac-arm64
    container_name: joshua-mac-u22-arm64-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      # Note: /dev:/dev is NOT mounted by default for macOS because:
      # 1. macOS device names (/dev/tty.*, /dev/cu.*) don't match Linux names (/dev/ttyACM*, /dev/ttyUSB*)
      # 2. Mounting /dev prevents creating mock serial ports in the container
      # To mount /dev for real device access, uncomment the line below:
      # - /dev:/dev
      - bazel-cache-u22-mac-arm64:/root/.cache/bazel
    environment:
      - ROS_DISTRO=humble
      - DISPLAY=${DISPLAY:-}
      # Set to "true" to automatically create mock serial ports for development
      # Mock ports allow the application to run without physical serial devices
      - ENABLE_MOCK_SERIAL_PORTS=${ENABLE_MOCK_SERIAL_PORTS:-true}
      - JOSHUA_ENV_CACHE=/workspace/.cache/joshua/envs
    # No entrypoint override: the image entrypoint sources ROS2 and honors
    # ENABLE_MOCK_SERIAL_PORTS.
    working_dir: /workspace
    profiles:
      - arm64  # Only build when explicitly requested
      - mac    # macOS-specific profile

  # Ubuntu 24.04 + ROS2 Jazzy + Python 3.12 for ARM64 (Experimental)
  # Note: Use profile 'arm64' to build these services (requires cross-platform build support)
  joshua-u24-arm64:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ubuntu24
      platforms:
        - linux/arm64
    image: joshua:u24-jazzy-arm64
    container_name: joshua-u24-arm64-dev
    stdin_open: true
    tty: true
    privileged: true
    network_mode: host
    volumes:
      - .:/workspace
      - /dev:/dev
      - bazel-cache-u24-arm64:/root/.cache/bazel
    environment:
      - ROS_DISTRO=jazzy
      - DISPLAY=${DISPLAY:-}
      - JOSHUA_ENV_CACHE=/workspace/.cache/joshua/envs
    working_dir: /workspace
    profiles:
      - arm64  # Only build when explicitly requested

  build-u22-arm64:
    extends:
      service: joshua-u22-arm64
    container_name: joshua-build-u22-arm64
    command:
      - /workspace/scripts/container_build.sh
      - u22
      - arm64
      - ${TARGET:-//launcher:joshua_main_pkg}
      - --config=u22
      - --config=arm64-base
      - --@rules_python//python/config_settings:python_version=3.10
    profiles: [tasks]

  build-u24-arm64:
    extends:
      service: joshua-u24-arm64
    container_name: joshua-build-u24-arm64
    command:
      - /workspace/scripts/container_build.sh
      - u24
      - arm64
      - ${TARGET:-//launcher:joshua_main_pkg}
      - --config=u24
      - --config=arm64-base
      - --@rules_python//python/config_settings:python_version=3.12
    profiles: [tasks]

  joshua-ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    container_name: joshua-ui
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ZENOH_BRIDGE_URL=${ZENOH_BRIDGE_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
    profiles:
      - production  # Use profile to avoid conflicts with joshua-ui-dev

volumes:
  bazel-cache-u22:
  bazel-cache-u24:
  bazel-cache-u22-arm64:
  bazel-cache-u22-mac-arm64:
  bazel-cache-u24-arm64:
