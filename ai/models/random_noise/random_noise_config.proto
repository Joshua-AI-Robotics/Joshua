syntax = "proto3";

package ai.models;

// Per-publisher position range in raw operational units (e.g. servo ticks).
message OutputRange {
  double low = 1;
  double high = 2;
}

message RandomNoiseConfig {
  uint32 input_size = 1;
  uint32 output_size = 2;
  // One range per publisher/output; values are uniform random in [low, high].
  repeated OutputRange output_ranges = 3;
}
