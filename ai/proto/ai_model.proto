syntax = "proto3";

package ai.models;

import "ai/models/random_noise/random_noise_config.proto";
import "ros2/proto/node.proto";
import "ros2/proto/ros2_data_type.proto";

message SingleModel {
  string policy_name = 1;
  string pretrained_model_path = 2;
  ros2.node.Node node = 3;
  repeated Subscription subscriptions = 4;
  repeated Publisher pubishers = 5;
  oneof policy_config {
    RandomNoiseConfig random_noise_config = 6;
  }
}

message Publisher {
  ros2.data_type.Ros2DataType ros2_data_type = 1;
  string topic = 2;
}

message Subscription {
  ros2.data_type.Ros2DataType ros2_data_type = 1;
  string topic = 2;
}

message Model {
  repeated SingleModel single_models = 1;
}
