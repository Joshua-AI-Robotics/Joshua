syntax = "proto3";

package ai.training;

enum TrainingEnvironment {
  TRAINING_ENV_INVALID = 0;
  TRAINING_ENV_SIMULATION = 1;
  TRAINING_ENV_REAL = 2;
}

enum TrainingMethod {
  TRAINING_METHOD_INVALID = 0;
  TRAINING_METHOD_RL = 1;
  TRAINING_METHOD_IMITATION = 2;
  TRAINING_METHOD_EVAL = 3;
  TRAINING_METHOD_TRAJECTORY_EXPORT = 4;
}

enum SimulatorBackend {
  SIM_BACKEND_INVALID = 0;
  SIM_BACKEND_ISAAC_SIM = 2;
}

// ---------------------------------------------------------------------------
// Tier 1: Algorithm, network, physics, and task configuration
// ---------------------------------------------------------------------------

message PPOConfig {
  float learning_rate = 1;
  float gamma = 2;
  float gae_lambda = 3;
  float clip_epsilon = 4;
  float vf_coeff = 5;
  float entropy_coef = 6;
  float max_grad_norm = 7;
  uint32 num_minibatches = 8;
  uint32 num_learning_epochs = 9;
  uint32 num_steps_per_env = 10;
  float desired_kl = 11;
  string schedule = 12;
  bool use_clipped_value_loss = 13;
}

message NetworkConfig {
  repeated uint32 actor_hidden_dims = 1;
  repeated uint32 critic_hidden_dims = 2;
  string activation = 3;
  float init_noise_std = 4;
  bool empirical_normalization = 5;
}

message SimPhysicsConfig {
  uint32 decimation = 1;
  float episode_length_s = 2;
  float sim_dt = 3;
  float terrain_friction = 4;
  float bounce_threshold_velocity = 5;
  float env_spacing = 6;
  float action_scale = 7;
  uint32 solver_position_iterations = 8;
  uint32 solver_velocity_iterations = 9;
  float max_depenetration_velocity = 10;
}

message TerminationConfig {
  float min_root_height = 1;
}

message ResetConfig {
  float joint_pos_range_min = 1;
  float joint_pos_range_max = 2;
  float joint_vel_range_min = 3;
  float joint_vel_range_max = 4;
}

message TargetConfig {
  double x = 1;
  double y = 2;
  double z = 3;
}

// ---------------------------------------------------------------------------
// Tier 1b: Generic task definition (replaces per-robot Python files)
// ---------------------------------------------------------------------------

message RobotConfig {
  string usd_filename = 1;
  double init_pos_x = 2;
  double init_pos_y = 3;
  double init_pos_z = 4;
  map<string, double> init_joint_pos = 5;
  double actuator_stiffness = 6;
  double actuator_damping = 7;
}

message TermConfig {
  double weight = 1;
  map<string, double> params = 2;
  repeated string body_names = 3;
  map<string, double> gear_ratios = 4;
}

message TaskConfig {
  string task_name = 1;
  RobotConfig robot = 2;
  map<string, TermConfig> rewards = 3;
  map<string, TermConfig> observations = 4;
}

// ---------------------------------------------------------------------------
// Tier 2: Future-proofing (not wired yet, proto-ready)
// ---------------------------------------------------------------------------

message DomainRandomizationConfig {
  float mass_range_min = 1;
  float mass_range_max = 2;
  float friction_range_min = 3;
  float friction_range_max = 4;
  float force_perturbation_range = 5;
  float gravity_variation = 6;
  float interval_s = 7;
}

message CurriculumConfig {
  uint32 terrain_level_min = 1;
  uint32 terrain_level_max = 2;
  float command_velocity_min = 3;
  float command_velocity_max = 4;
}

message TerrainConfig {
  string terrain_type = 1;
  string terrain_usd_path = 2;
  uint32 num_terrain_levels = 3;
  repeated float terrain_proportions = 4;
}

message LoggingConfig {
  string logger_type = 1;
  string project_name = 2;
  string run_name = 3;
  uint32 log_interval = 4;
}

message ObservationNoiseConfig {
  string noise_type = 1;
  float noise_std = 2;
  float clip_min = 3;
  float clip_max = 4;
}

message ResumeConfig {
  string resume_path = 1;
  string load_run = 2;
  string load_checkpoint = 3;
}

// ---------------------------------------------------------------------------
// Core config messages
// ---------------------------------------------------------------------------

message RLConfig {
  string task = 1;
  uint32 frame_skip = 2;
  string algorithm = 3;
  uint32 total_timesteps = 4;
  uint32 num_eval_episodes = 5;
  string checkpoint_path = 6;
  string save_path = 7;
  bool render = 8;
  bool image_obs = 9;
  string camera_name = 10;
  uint32 num_envs = 11;
  uint32 max_iterations = 12;

  // Tier 1: algorithm, network, physics, MDP
  PPOConfig ppo = 20;
  NetworkConfig network = 21;
  SimPhysicsConfig sim_physics = 22;
  TerminationConfig termination = 23;
  ResetConfig reset = 24;
  TargetConfig target = 25;
  TaskConfig task_config = 26;
  uint32 save_interval = 27;
  uint32 seed = 28;
  string checkpoint_dir = 29;

  // Tier 2: future-proofing
  DomainRandomizationConfig domain_randomization = 40;
  CurriculumConfig curriculum = 41;
  TerrainConfig terrain = 42;
  LoggingConfig logging = 43;
  ObservationNoiseConfig observation_noise = 44;
  ResumeConfig resume = 45;

  // Tier 3: escape hatch
  map<string, string> extra_params = 50;
}

message ImitationConfig {
  string dataset_path = 1;
  string base_model = 2;
  uint32 epochs = 3;
  float learning_rate = 4;
  string save_path = 5;
  uint32 batch_size = 6;
}

message EvalConfig {
  string checkpoint_path = 1;
  uint32 num_episodes = 2;
  bool render = 3;
  string task = 4;
  string algorithm = 5;
  uint32 num_envs = 6;

  // Proto-defined task (same block used in RLConfig.task_config).
  // When set, the eval runner rebuilds the environment from proto
  // instead of looking up a static Python task file.
  TaskConfig task_config = 10;
  NetworkConfig network = 11;
  SimPhysicsConfig sim_physics = 12;
  TerminationConfig termination = 13;
  ResetConfig reset = 14;
  PPOConfig ppo = 15;
}

message JointTopicMapping {
  string joint_name = 1;
  string topic = 2;
}

message TrajectoryExportConfig {
  string checkpoint_path = 1;
  string task = 2;
  string algorithm = 3;
  uint32 warmup_steps = 4;
  uint32 num_record_steps = 5;
  string output_dir = 6;
  bool detect_cycle = 7;
  uint32 trajectory_node_id = 8;
  bool render = 9;

  repeated JointTopicMapping joint_topic_mappings = 10;

  TaskConfig task_config = 20;
  NetworkConfig network = 21;
  SimPhysicsConfig sim_physics = 22;
  TerminationConfig termination = 23;
  ResetConfig reset = 24;
  PPOConfig ppo = 25;
}

message TrainingConfig {
  TrainingEnvironment environment = 1;
  TrainingMethod method = 2;
  string model_path = 3;
  SimulatorBackend simulator_backend = 4;
  RLConfig rl = 10;
  ImitationConfig imitation = 11;
  EvalConfig eval = 12;
  TrajectoryExportConfig trajectory_export = 13;
}
