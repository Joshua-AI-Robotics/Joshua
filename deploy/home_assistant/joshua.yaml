input_boolean:
  joshua_notifications:
    name: Notifications
    icon: mdi:bell
  joshua_motion_notifications:
    name: Movement notifications
    icon: mdi:motion-sensor
  joshua_health_alerted:
    name: Monitor outage notification sent
input_text:
  joshua_notification_actions:
    name: Phone notification actions
    max: 255
  joshua_last_notification:
    name: Last delivered event ID
    max: 255

script:
  joshua_notify_phones:
    alias: Joshua - notify selected phones
    mode: queued
    max: 10
    fields:
      title:
        description: Notification title
      message:
        description: Notification text
      critical_alert:
        description: Send an iPhone critical alert
        default: false
    sequence:
      - repeat:
          for_each: >-
            {{ states('input_text.joshua_notification_actions').split(',')
               | map('trim') | select('match', '^notify\\.mobile_app_[a-z0-9_]+$') | list }}
          sequence:
            - action: '{{ repeat.item }}'
              continue_on_error: true
              data:
                title: '{{ title }}'
                message: '{{ message }}'
                data:
                  url: /baby-monitor/live
                  group: joshua-baby-monitor
                  push: >-
                    {{ {'sound': {'name': 'default',
                                  'critical': 1,
                                  'volume': 1.0}}
                       if critical_alert | default(false) | bool
                       else {'sound': 'default'} }}
  joshua_test_notification:
    alias: Joshua - send test notification
    sequence:
      - if:
          - condition: template
            value_template: >-
              {{ not (states('input_text.joshua_notification_actions').split(',')
                 | map('trim') | select('match', '^notify\\.mobile_app_[a-z0-9_]+$') | list) }}
        then:
          - action: persistent_notification.create
            data:
              title: Select your phones first
              message: >-
                Enter the notify.mobile_app_* action names from Settings → Tools →
                Actions in the Baby Monitor dashboard's Phone notification actions.
        else:
          - action: script.joshua_notify_phones
            data:
              title: Baby Monitor test
              message: Notifications are connected. Tap to open the live camera.

automation:
  - id: joshua_receive_events
    alias: Joshua - receive local events
    triggers:
      - trigger: webhook
        webhook_id: !secret joshua_webhook
        allowed_methods: [POST]
        local_only: true
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.json is defined and trigger.json.schema_version == 1
             and trigger.json.event_id is string }}
    actions:
      - event: joshua_monitor
        event_data:
          payload: '{{ trigger.json }}'
    mode: queued
    max: 32
  - id: joshua_cry_reminders
    alias: Joshua - repeat alerts while crying continues
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.joshua_crying
          - input_boolean.joshua_notifications
          - binary_sensor.joshua_notification_configured
        to: null
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: automation_reloaded
    actions:
      - repeat:
          while:
            - condition: state
              entity_id: binary_sensor.joshua_crying
              state: 'on'
            - condition: state
              entity_id: input_boolean.joshua_notifications
              state: 'on'
            - condition: state
              entity_id: binary_sensor.joshua_notification_configured
              state: 'on'
          sequence:
            - wait_template: >-
                {{ not (is_state('binary_sensor.joshua_crying', 'on')
                   and is_state('input_boolean.joshua_notifications', 'on')
                   and is_state('binary_sensor.joshua_notification_configured', 'on')) }}
              timeout: '00:01:00'
              continue_on_timeout: true
            - condition: template
              value_template: >-
                {{ not wait.completed
                   and is_state('binary_sensor.joshua_crying', 'on')
                   and is_state('input_boolean.joshua_notifications', 'on')
                   and is_state('binary_sensor.joshua_notification_configured', 'on') }}
            - action: script.joshua_notify_phones
              data:
                title: Baby Monitor - still crying
                message: Crying is still detected. Open the camera to check.
                critical_alert: true
    mode: restart
  - id: joshua_notify_events
    alias: Joshua - send monitor alerts
    triggers:
      - trigger: event
        event_type: joshua_monitor
    conditions:
      - condition: state
        entity_id: input_boolean.joshua_notifications
        state: 'on'
      - condition: template
        value_template: >-
          {% set p = trigger.event.data.payload %}
          {{ p.get('notify', false)
             and p.get('kind') not in ['input_stale', 'input_restored',
                                       'inference_error', 'stream_error']
             and p.event_id != states('input_text.joshua_last_notification')
             and p.get('expires_at_ns', 0) / 1000000000 > as_timestamp(now())
             and (p.get('kind') != 'movement'
                  or is_state('input_boolean.joshua_motion_notifications', 'on')) }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: input_text.joshua_last_notification
        data:
          value: '{{ trigger.event.data.payload.event_id }}'
      - action: script.joshua_notify_phones
        data:
          title: '{{ trigger.event.data.payload.title }}'
          message: '{{ trigger.event.data.payload.message }}'
          critical_alert: "{{ trigger.event.data.payload.get('kind') == 'cry_started' }}"
    mode: queued
    max: 32
  - id: joshua_health_watchdog
    alias: Joshua - monitor health watchdog
    triggers:
      - trigger: time_pattern
        seconds: /15
    conditions:
      - condition: state
        entity_id: input_boolean.joshua_notifications
        state: 'on'
      - condition: state
        entity_id: binary_sensor.joshua_notification_configured
        state: 'on'
      - condition: state
        entity_id: input_boolean.joshua_health_alerted
        state: 'off'
      - condition: template
        value_template: >-
          {{ states('sensor.joshua_monitor_status') in ['offline', 'degraded']
             and as_timestamp(now()) - as_timestamp(
               states.sensor.joshua_monitor_status.last_changed) >= 15 }}
    actions:
      - action: script.joshua_notify_phones
        data:
          title: Baby Monitor needs attention
          message: >-
            Monitor is {{ states('sensor.joshua_monitor_status') }}.
            {% set p = state_attr('sensor.joshua_monitor_status', 'payload') or {} %}
            {% if as_timestamp(now()) - (state_attr('sensor.joshua_monitor_status',
               'received_at') | float(0)) >= 30 %}
            No heartbeat from Joshua. Live monitoring may have stopped.
            {% else %}
            {% for topic, status in p.get('inputs', {}).items() if status != 'ok' %}
            {{ topic }}: {{ status }}.
            {% endfor %}
            {% endif %}
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.joshua_health_alerted
    mode: single
  - id: joshua_health_recovered
    alias: Joshua - monitor health restored
    triggers:
      - trigger: state
        entity_id: sensor.joshua_monitor_status
        to: online
        for: '00:00:10'
    conditions:
      - condition: state
        entity_id: input_boolean.joshua_health_alerted
        state: 'on'
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.joshua_health_alerted
      - condition: state
        entity_id: input_boolean.joshua_notifications
        state: 'on'
      - action: script.joshua_notify_phones
        data:
          title: Baby Monitor restored
          message: Audio, video inference, and streaming are receiving fresh input again.
    mode: single

template:
  - triggers:
      - trigger: event
        event_type: joshua_monitor
      - trigger: time_pattern
        seconds: /10
    sensor:
      - name: Joshua monitor status
        unique_id: joshua_monitor_status
        state: >-
          {% set received = as_timestamp(now()) if trigger.platform == 'event'
             else this.attributes.get('received_at', 0) | float(0) %}
          {% set p = trigger.event.data.payload if trigger.platform == 'event'
             else this.attributes.get('payload', {}) %}
          {% set inputs = p.get('inputs', {}) %}
          {% set good = inputs.values() | select('equalto', 'ok') | list | count %}
          {% if as_timestamp(now()) - received >= 30 %}offline
          {% elif not inputs %}starting
          {% elif good == inputs | count %}online
          {% elif good > 0 %}degraded
          {% elif inputs.values() | reject('in', ['waiting', 'starting'])
             | list | count == 0 %}starting
          {% else %}offline{% endif %}
        attributes:
          received_at: >-
            {{ as_timestamp(now()) if trigger.platform == 'event'
               else this.attributes.get('received_at', 0) }}
          payload: >-
            {{ trigger.event.data.payload if trigger.platform == 'event'
               else this.attributes.get('payload', {}) }}
  - binary_sensor:
      - name: Joshua notification configured
        unique_id: joshua_notification_configured
        state: >-
          {% set targets = states('input_text.joshua_notification_actions').split(',')
             | map('trim') | select('match', '^notify\\.mobile_app_[a-z0-9_]+$') | list %}
          {{ targets | count > 0 }}
      - name: Joshua crying
        unique_id: joshua_crying
        availability: >-
          {% set p = state_attr('sensor.joshua_monitor_status', 'payload') or {} %}
          {{ as_timestamp(now()) - (state_attr('sensor.joshua_monitor_status',
             'received_at') | float(0)) < 30 and p.get('crying') is boolean }}
        state: >-
          {{ (state_attr('sensor.joshua_monitor_status', 'payload') or {}).get('crying', false) }}
      - name: Joshua movement
        unique_id: joshua_movement
        device_class: motion
        availability: >-
          {% set p = state_attr('sensor.joshua_monitor_status', 'payload') or {} %}
          {{ as_timestamp(now()) - (state_attr('sensor.joshua_monitor_status',
             'received_at') | float(0)) < 30 and p.get('moving') is boolean }}
        state: >-
          {{ (state_attr('sensor.joshua_monitor_status', 'payload') or {}).get('moving', false) }}
