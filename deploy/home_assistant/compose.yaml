services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    container_name: joshua-home-assistant
    network_mode: host
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
    volumes:
      - ./config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  go2rtc:
    image: ghcr.io/alexxit/go2rtc:1.9.14@sha256:675c318b23c06fd862a61d262240c9a63436b4050d177ffc68a32710d9e05bae
    container_name: joshua-go2rtc
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
