; Arduino Uno R3 (ATmega328P) running Joshua's own firmware protocol
; (joshua_wire_v1), not a vendor sketch — see docs/BOARD_LAYER_RFC.md
; §7.1/§7.4. One environment per wiring variant; today only UART serial
; through the 16U2/CH340 USB-serial bridge, matching the Uno R3 bring-up.
; A future UDP/W5500 variant adds a second [env:...] here with zero
; changes to src/main.cpp's dispatch logic or to the host ArduinoBoard
; class — only transport_serial.cpp gets swapped for a transport_udp.cpp.
[platformio]
default_envs = uno-serial

[env:uno-serial]
platform = atmelavr
board = uno
framework = arduino
; -I src: firmware/common/backend_stepdir.{h,cpp} (pulled in below) depends
; on this project's own src/channel_table.h (ChannelState) — PlatformIO
; compiles a lib_deps library in its own scope and does NOT automatically
; expose the main project's src/ to it, so this needs to be explicit
; (docs/BOARD_LAYER_RFC.md §7.3, revised).
build_flags = -DJOSHUA_TRANSPORT_SERIAL -Wall -Wextra -I src
; joshua_wire_v1.{h,c} and backend_stepdir.{h,cpp} are the shared sources
; of truth, compiled again here (not cross-compiled via Bazel) so this
; firmware and the host build always agree
; (docs/BOARD_LAYER_RFC.md §7.3). symlink:// (not lib_extra_dirs) so
; PlatformIO's library scanner doesn't also walk into firmware/am243's
; vendor build tree or firmware/teensy itself.
lib_deps =
    symlink://../../common
; Official Uno R3 (ATmega16U2) enumerates as /dev/ttyACM*; CH340 clones as
; /dev/ttyUSB*. Override at upload time if needed:
;   pio run --target upload --upload-port /dev/ttyUSB0
monitor_speed = 115200
