; ESP32 running Joshua's own firmware protocol (joshua_wire_v1), not a
; vendor demo — see docs/BOARD_LAYER_RFC.md §7.1/§7.4. Same STEP_DIR/serial
; shape as firmware/teensy/41/, not the Wi-Fi/UDP transport variant the RFC
; speculated ESP32 might eventually prove (that needs a
; robot::comm::UdpTransport that doesn't exist yet). One environment per
; wiring variant; today there is only the serial (UART/USB-bridge)
; transport.
;
; `board = esp32dev` targets a generic ESP32 DevKitC-style board (the most
; common "ESP32 dev board"). If yours is a different variant (ESP32-S3,
; ESP32-C3, ESP32-S2, ...), change this one line — PlatformIO's board
; database has entries for most of them (`pio boards espressif32`); nothing
; else in this file or in src/ needs to change for a same-family swap.
[platformio]
default_envs = esp32-serial

[env:esp32-serial]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -DJOSHUA_TRANSPORT_SERIAL -Wall -Wextra -I src
; joshua_wire_v1.{h,c} and backend_stepdir.{h,cpp} are the shared sources
; of truth, compiled again here (not cross-compiled via Bazel) so this
; firmware and the host build always agree
; (docs/BOARD_LAYER_RFC.md §7.3). symlink:// (not lib_extra_dirs) so
; PlatformIO's library scanner doesn't also walk into firmware/am243's
; vendor build tree or firmware/teensy itself. -I src: firmware/common/
; backend_stepdir.{h,cpp} depends on this project's own src/channel_table.h
; (ChannelState) — PlatformIO compiles a lib_deps library in its own scope
; and does NOT automatically expose the main project's src/ to it.
;
; ../common, not ../../common: firmware/esp32/ is one level shallower than
; firmware/teensy/41/ (no chip-revision subdirectory), so the relative path
; back up to firmware/common/ is one ".." shorter.
lib_deps =
    symlink://../common
