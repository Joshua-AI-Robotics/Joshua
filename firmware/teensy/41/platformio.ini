; JoshuaWire 0.2.0 / revision 4. Shared codecs, endpoint and STEP/DIR app.
[platformio]
default_envs = teensy41-serial

[env:teensy41-serial]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -DJOSHUA_TRANSPORT_SERIAL -Wall -Wextra
; Compile the same shared sources as the host, with the real Arduino backend.
lib_deps =
    symlink://../../common
