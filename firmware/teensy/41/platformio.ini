; JoshuaWire 0.2.0 / revision 4. Shared codecs, endpoint and STEP/DIR app.
[platformio]
default_envs = teensy41-serial

[env:teensy41-serial]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = teensy-cli
build_flags = -DJOSHUA_TRANSPORT_SERIAL -Wall -Wextra
; Compile the same shared sources as the host, with the real Arduino backend.
lib_deps =
    symlink://../../common

; Explicit candidate artifact; production request-only image stays the default.
[env:teensy41-mixed-scalar]
extends = env:teensy41-serial
platform = teensy@5.0.0
build_flags = ${env:teensy41-serial.build_flags} -DJOSHUA_MIXED_ADC_REFERENCE

[env:teensy41-peripherals]
extends = env:teensy41-serial
platform = teensy@5.0.0
build_flags = ${env:teensy41-serial.build_flags} -DJOSHUA_PERIPHERAL_REFERENCE
