; Teensy 4.1 running Joshua's own firmware protocol (joshua_wire_v1), not a
; vendor demo — see docs/BOARD_LAYER_RFC.md §7.1/§7.4. One environment per
; wiring variant, each producing an unambiguous artifact name; today there
; is only the serial (native USB) transport, matching Phase 5's scope
; (docs/BOARD_LAYER_RFC.md §10 Phase 5). A future UDP/W5500 variant adds a
; second [env:...] here with zero changes to src/main.cpp's dispatch logic
; or to the host TeensyBoard class — only transport_serial.cpp gets
; swapped for a transport_udp.cpp.
[platformio]
default_envs = teensy41-serial

[env:teensy41-serial]
platform = teensy
board = teensy41
framework = arduino
; teensy-gui launches a GUI Teensy Loader app that isn't installed on a
; headless dev machine; teensy-cli drives teensy_loader_cli instead, which
; PlatformIO bundles with the teensy platform.
upload_protocol = teensy-cli
; -I src: firmware/common/backend_stepdir.{h,cpp} (pulled in below) depends
; on this project's own src/channel_table.h (ChannelState) — PlatformIO
; compiles a lib_deps library in its own scope and does NOT automatically
; expose the main project's src/ to it, so this needs to be explicit
; (docs/BOARD_LAYER_RFC.md §7.3, revised).
build_flags = -DJOSHUA_TRANSPORT_SERIAL -Wall -Wextra -I src
; joshua_wire_v1.{h,c} and backend_stepdir.{h,cpp} are the shared sources
; of truth, compiled again here (not cross-compiled via Bazel) so this
; firmware and the host build always agree
; (docs/BOARD_LAYER_RFC.md §7.3). symlink:// (not lib_extra_dirs) so
; PlatformIO's library scanner doesn't also walk into firmware/am243's
; vendor build tree or firmware/teensy itself.
lib_deps =
    symlink://../../common
